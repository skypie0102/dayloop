name: P3R frame review
on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/**'
      - 'tools/android/**'
      - '.github/workflows/p3r-frame-review.yml'
  workflow_dispatch:
    inputs:
      baseline_sha:
        description: 'Baseline source commit to compare on the same AVD'
        default: '09a7969c44f11721f60eab6d0a13ff77a4fc2562'
        required: true
permissions:
  contents: read
jobs:
  frames:
    if: github.event_name == 'workflow_dispatch' || contains(github.head_ref, 'p3r')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      P3R_BASELINE_SHA: ${{ github.event.pull_request.base.sha || inputs.baseline_sha }}
      P3R_REVIEW_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build both app versions and one shared frame probe
        run: |
          set -euo pipefail
          mkdir -p build/frame-apks
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          cp app/build/outputs/apk/debug/app-debug.apk build/frame-apks/optimized.apk
          git worktree add --detach build/frame-baseline "$P3R_BASELINE_SHA"
          (cd build/frame-baseline && ./gradlew :app:assembleDebug --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process)
          cp build/frame-baseline/app/build/outputs/apk/debug/app-debug.apk build/frame-apks/baseline.apk
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Compare real Window frames on the same AVD
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash tools/android/review-p3r-frames.sh
      - name: Upload frame review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3r-frame-review-${{ github.sha }}
          path: build/frame-review/
          retention-days: 14
          if-no-files-found: warn
