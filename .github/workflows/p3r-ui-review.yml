name: P3R Android visual review
on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/pack/**'
      - 'content/packs/p3r/**'
      - 'tools/android/**'
      - '.github/workflows/p3r-ui-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.head_ref, 'p3r')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - review: full
            classes: com.shadowmonarchbooks.dayloop.ui.skin.SubmergedDailyTest,com.shadowmonarchbooks.dayloop.ui.skin.SubmergedAppFlowTest
          - review: hand-in-isolated
            classes: com.shadowmonarchbooks.dayloop.ui.skin.SubmergedAppFlowTest#exactHandInUpdatesRequestsAndUncheckingReversesIt
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build review APKs before starting the emulator
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise daily components and capture Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          P3R_UI_TEST_CLASSES: ${{ matrix.classes }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_2
          disable-animations: true
          # Use the supported software renderer and GLES for this Compose review.
          # https://developer.android.com/studio/run/emulator-acceleration
          # https://developer.android.com/studio/run/emulator-troubleshooting
          emulator-options: -no-window -gpu swiftshader -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -show-kernel
          script: bash tools/android/capture-p3r-ui.sh
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p3r-android-review-${{ matrix.review }}-${{ github.sha }}
          path: |
            build/ui-captures/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: warn
