name: Stable release

on:
  pull_request:
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/release.yml'
      - '.github/release-requests/v0.15.1.md'
      - 'docs/LOCAL_BUILD.md'
  push:
    branches: [ main ]
    paths:
      - '.github/release-requests/v0.15.1.md'

permissions:
  contents: write

env:
  DAYLOOP_ANDROID_SDK_VERSION: '35'
  DAYLOOP_ANDROID_BUILD_TOOLS: '35.0.0'
  DAYLOOP_ANDROID_CMDLINE_TOOLS: '13114758'
  RELEASE_TAG: 'v0.15.1'
  RELEASE_NAME: 'v0.15.1 — P5R polish update'
  RELEASE_NOTES_PATH: '.github/release-requests/v0.15.1.md'
  APK_NAME: 'dayloop-v0.15.1-release.apk'

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail

          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_VERSION="${DAYLOOP_ANDROID_CMDLINE_TOOLS}"
          CMDLINE_TOOLS_ZIP="commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools"
          LATEST_DIR="$TOOLS_DIR/latest"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$LATEST_DIR/bin:$SDK_ROOT/platform-tools:$PATH"

          mkdir -p "$TOOLS_DIR"
          if [ ! -x "$LATEST_DIR/bin/sdkmanager" ]; then
            temp_dir="$(mktemp -d)"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/$CMDLINE_TOOLS_ZIP"
            curl --fail --location --silent --show-error "$CMDLINE_TOOLS_URL" -o "$archive"
            unzip -q "$archive" -d "$temp_dir/unpacked"
            mkdir -p "$LATEST_DIR"
            mv "$temp_dir/unpacked/cmdline-tools"/* "$LATEST_DIR/"
          fi

          printf '%s\n' "$LATEST_DIR/bin" "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${DAYLOOP_ANDROID_SDK_VERSION}" \
            "build-tools;${DAYLOOP_ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build stable APK and test
        run: ./gradlew assembleRelease :core:pack:test :core:progress:test :tools:pack:test :app:testDebugUnitTest

      - name: Validate content packs
        run: |
          ./gradlew packlint
          ./gradlew packlint "-Ppack=content/packs/p3r"
          ./gradlew packlint "-Ppack=content/packs/metaphor"

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK_PATH='app/build/outputs/apk/release/app-release.apk'
          "${ANDROID_SDK_ROOT}/build-tools/${DAYLOOP_ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$APK_PATH"
          mkdir -p release-out
          cp "$APK_PATH" "release-out/${APK_NAME}"
          sha256sum "release-out/${APK_NAME}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayloop-v0.15.1-release
          path: release-out/${{ env.APK_NAME }}
          if-no-files-found: error

      - name: Publish stable GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          ASSET_PATH: release-out/${{ env.APK_NAME }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const apkName = process.env.APK_NAME;
            const body = fs.readFileSync(process.env.RELEASE_NOTES_PATH, 'utf8');

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              core.info(`Release ${tag} already exists; reusing it.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: process.env.RELEASE_NAME,
                body,
                draft: false,
                prerelease: false,
                make_latest: 'true',
              })).data;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            if (assets.some(asset => asset.name === apkName)) {
              core.info(`${apkName} is already attached; nothing to upload.`);
              return;
            }

            const data = fs.readFileSync(process.env.ASSET_PATH);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: apkName,
              data,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length,
              },
            });
            core.info(`Published ${apkName} to ${tag}.`);
