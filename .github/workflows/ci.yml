name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew assembleDebug assembleCandidate :core:pack:test :core:progress:test :tools:pack:test :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin

      - name: Validate content packs (packlint)
        run: |
          ./gradlew packlint
          ./gradlew packlint "-Ppack=content/packs/p3r"
          ./gradlew packlint "-Ppack=content/packs/metaphor"
