name: Release candidate

on:
  pull_request:
    paths:
      - 'app/build.gradle.kts'
      - '.github/workflows/release-candidate.yml'
      - '.github/release-requests/v0.16.0-rc1.md'
      - 'docs/LOCAL_BUILD.md'
  push:
    branches: [ main ]
    paths:
      - '.github/release-requests/v0.16.0-rc1.md'

permissions:
  contents: write

env:
  DAYLOOP_ANDROID_SDK_VERSION: '35'
  DAYLOOP_ANDROID_BUILD_TOOLS: '35.0.0'
  DAYLOOP_ANDROID_CMDLINE_TOOLS: '13114758'
  RELEASE_TAG: 'v0.16.0-rc1'
  RELEASE_NAME: 'v0.16.0-rc1 — P3R UI and complete request guidance'
  RELEASE_NOTES_PATH: '.github/release-requests/v0.16.0-rc1.md'
  APK_NAME: 'dayloop-v0.16.0-rc1-candidate.apk'

jobs:
  candidate:
    # The same tests and packlint gates run here before the APK is retained or published.
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail

          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_VERSION="${DAYLOOP_ANDROID_CMDLINE_TOOLS}"
          CMDLINE_TOOLS_ZIP="commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools"
          LATEST_DIR="$TOOLS_DIR/latest"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$LATEST_DIR/bin:$SDK_ROOT/platform-tools:$PATH"

          mkdir -p "$TOOLS_DIR"

          if [ ! -x "$LATEST_DIR/bin/sdkmanager" ]; then
            temp_dir="$(mktemp -d)"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/$CMDLINE_TOOLS_ZIP"
            curl --fail --location --silent --show-error "$CMDLINE_TOOLS_URL" -o "$archive"
            unzip -q "$archive" -d "$temp_dir/unpacked"
            rm -rf "$LATEST_DIR"
            mkdir -p "$LATEST_DIR"
            mv "$temp_dir/unpacked/cmdline-tools"/* "$LATEST_DIR/"
          fi

          printf '%s\n' "$LATEST_DIR/bin" "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${DAYLOOP_ANDROID_SDK_VERSION}" \
            "build-tools;${DAYLOOP_ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build candidate and test
        run: ./gradlew assembleCandidate :core:pack:test :core:progress:test :tools:pack:test :app:testDebugUnitTest

      - name: Validate content packs
        run: |
          ./gradlew packlint
          ./gradlew packlint "-Ppack=content/packs/p3r"
          ./gradlew packlint "-Ppack=content/packs/metaphor"

      - name: Verify and stage APK
        run: |
          set -euo pipefail
          APK_PATH='app/build/outputs/apk/candidate/app-candidate.apk'
          "${ANDROID_SDK_ROOT}/build-tools/${DAYLOOP_ANDROID_BUILD_TOOLS}/apksigner" verify --verbose "$APK_PATH"
          mkdir -p release-out
          cp "$APK_PATH" "release-out/${APK_NAME}"
          (cd release-out && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayloop-v0.16.0-rc1-candidate
          path: release-out/*
          if-no-files-found: error

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/github-script@v7
        env:
          ASSET_PATH: release-out/${{ env.APK_NAME }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            const apkName = process.env.APK_NAME;
            const body = fs.readFileSync(process.env.RELEASE_NOTES_PATH, 'utf8') + `\n\nSource commit: ${context.sha}\n`;

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              core.info(`Release ${tag} already exists; reusing it.`);
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: context.sha,
                name: process.env.RELEASE_NAME,
                body,
                draft: false,
                prerelease: true,
              })).data;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            if (assets.some(asset => asset.name === apkName)) {
              core.info(`${apkName} is already attached; nothing to upload.`);
              return;
            }

            const data = fs.readFileSync(process.env.ASSET_PATH);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: apkName,
              data,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length,
              },
            });
            core.info(`Published ${apkName} to ${tag}.`);

  p5r-review:
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/p5r-data-theme'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      P5R_RELEASE_TAG: 'v0.12.0-p5r-review.1'
      P5R_RELEASE_NAME: 'v0.12.0-p5r-review.1 — P5R visual QA build'
      P5R_APK_NAME: 'dayloop-v0.12.0-p5r-review.1.apk'

    steps:
      - name: Checkout P5R branch head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          set -euo pipefail

          SDK_ROOT="$HOME/android-sdk"
          CMDLINE_TOOLS_VERSION="${DAYLOOP_ANDROID_CMDLINE_TOOLS}"
          CMDLINE_TOOLS_ZIP="commandlinetools-linux-${CMDLINE_TOOLS_VERSION}_latest.zip"
          CMDLINE_TOOLS_URL="https://dl.google.com/android/repository/${CMDLINE_TOOLS_ZIP}"
          TOOLS_DIR="$SDK_ROOT/cmdline-tools"
          LATEST_DIR="$TOOLS_DIR/latest"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          export ANDROID_HOME="$SDK_ROOT"
          export PATH="$LATEST_DIR/bin:$SDK_ROOT/platform-tools:$PATH"

          mkdir -p "$TOOLS_DIR"

          if [ ! -x "$LATEST_DIR/bin/sdkmanager" ]; then
            temp_dir="$(mktemp -d)"
            trap 'rm -rf "$temp_dir"' EXIT
            archive="$temp_dir/$CMDLINE_TOOLS_ZIP"
            curl --fail --location --silent --show-error "$CMDLINE_TOOLS_URL" -o "$archive"
            unzip -q "$archive" -d "$temp_dir/unpacked"
            rm -rf "$LATEST_DIR"
            mkdir -p "$LATEST_DIR"
            mv "$temp_dir/unpacked/cmdline-tools"/* "$LATEST_DIR/"
          fi

          printf '%s\n' "$LATEST_DIR/bin" "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          {
            echo "ANDROID_SDK_ROOT=$SDK_ROOT"
            echo "ANDROID_HOME=$SDK_ROOT"
          } >> "$GITHUB_ENV"

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-${DAYLOOP_ANDROID_SDK_VERSION}" \
            "build-tools;${DAYLOOP_ANDROID_BUILD_TOOLS}"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build P5R candidate and test
        run: ./gradlew assembleCandidate :core:pack:test :core:progress:test :tools:pack:test :app:testDebugUnitTest

      - name: Validate all content packs
        run: |
          ./gradlew packlint
          ./gradlew packlint "-Ppack=content/packs/p3r"
          ./gradlew packlint "-Ppack=content/packs/p5r"
          ./gradlew packlint "-Ppack=content/packs/metaphor"

      - name: Prepare P5R APK asset
        run: |
          mkdir -p release-out
          cp app/build/outputs/apk/candidate/app-candidate.apk "release-out/${P5R_APK_NAME}"

      - name: Upload P5R workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dayloop-v0.12.0-p5r-review.1
          path: release-out/${{ env.P5R_APK_NAME }}
          if-no-files-found: error

      - name: Publish P5R GitHub prerelease
        uses: actions/github-script@v7
        env:
          ASSET_PATH: release-out/${{ env.P5R_APK_NAME }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const tag = process.env.P5R_RELEASE_TAG;
            const apkName = process.env.P5R_APK_NAME;
            const target = context.payload.pull_request.head.sha;
            const body = [
              'Installable P5R visual-QA build from PR #10.',
              '',
              `Source commit: ${target}`,
              '',
              '- Candidate application id: `com.shadowmonarchbooks.dayloop.candidate`',
              '- Debug-key signed; intended for direct device/emulator testing',
              '- Can coexist with the production Dayloop app',
              '- Includes the completed P5R data audit and current ink/slash UI pass',
              '- Android/JVM tests and packlint (P3R, P5R, Metaphor) passed before publishing',
            ].join('\n');

            let release;
            try {
              release = (await github.rest.repos.getReleaseByTag({ owner, repo, tag })).data;
              await github.rest.repos.updateRelease({
                owner,
                repo,
                release_id: release.id,
                name: process.env.P5R_RELEASE_NAME,
                body,
                prerelease: true,
              });
              try {
                await github.rest.git.updateRef({
                  owner,
                  repo,
                  ref: `tags/${tag}`,
                  sha: target,
                  force: true,
                });
              } catch (error) {
                core.warning(`Could not move existing review tag: ${error.message}`);
              }
            } catch (error) {
              if (error.status !== 404) throw error;
              release = (await github.rest.repos.createRelease({
                owner,
                repo,
                tag_name: tag,
                target_commitish: target,
                name: process.env.P5R_RELEASE_NAME,
                body,
                draft: false,
                prerelease: true,
              })).data;
            }

            const assets = await github.paginate(github.rest.repos.listReleaseAssets, {
              owner,
              repo,
              release_id: release.id,
              per_page: 100,
            });
            for (const asset of assets) {
              if (asset.name === apkName) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: asset.id });
              }
            }

            const data = fs.readFileSync(process.env.ASSET_PATH);
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: release.id,
              name: apkName,
              data,
              headers: {
                'content-type': 'application/vnd.android.package-archive',
                'content-length': data.length,
              },
            });
            core.info(`Published ${apkName} to ${tag}.`);
