name: P5R walkthrough Android review

on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/pack/**'
      - 'content/packs/p5r/**'
      - 'tools/android/**'
      - '.github/workflows/p5r-walkthrough-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.head_ref, 'p5r')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build Android review APKs
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest assembleCandidate --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          ./gradlew --stop
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise inline guidance, enlarged text and saved task indexes
        uses: reactivecircus/android-emulator-runner@v2
        env:
          P3R_UI_TEST_CLASSES: com.shadowmonarchbooks.dayloop.ui.skin.P5rWalkthroughTest
        with:
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -show-kernel
          script: bash tools/android/capture-p3r-ui.sh
      - name: Upload screenshots and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p5r-walkthrough-review-${{ github.sha }}
          path: |
            build/ui-captures/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload candidate APK
        uses: actions/upload-artifact@v4
        with:
          name: p5r-walkthrough-candidate-${{ github.sha }}
          path: app/build/outputs/apk/candidate/app-candidate.apk
          retention-days: 14
          if-no-files-found: error
