name: Metaphor Android visual review
on:
  pull_request:
    paths:
      - 'app/**'
      - 'core/pack/**'
      - 'content/packs/metaphor/**'
      - 'tools/android/**'
      - '.github/workflows/metaphor-ui-review.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || contains(github.head_ref, 'metaphor')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - review: full
            classes: com.shadowmonarchbooks.dayloop.ui.skin.PaintedDailyTest,com.shadowmonarchbooks.dayloop.ui.skin.MetaphorAppFlowTest,com.shadowmonarchbooks.dayloop.ui.skin.SubmergedDailyTest,com.shadowmonarchbooks.dayloop.ui.skin.SubmergedAppFlowTest,com.shadowmonarchbooks.dayloop.ui.skin.P3rWalkthroughTest,com.shadowmonarchbooks.dayloop.ui.skin.P5rWalkthroughTest,com.shadowmonarchbooks.dayloop.ui.skin.SkinMotionReviewTest,com.shadowmonarchbooks.dayloop.ui.skin.SubmergedUtilityTest
          - review: baseline
            classes: com.shadowmonarchbooks.dayloop.ui.skin.MetaphorBaselineTest
          - review: hand-in-isolated
            classes: com.shadowmonarchbooks.dayloop.ui.skin.SubmergedAppFlowTest#exactHandInUpdatesRequestsAndUncheckingReversesIt
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore the original production baseline for a before capture
        if: matrix.review == 'baseline'
        run: |
          cp app/src/androidTest/java/com/shadowmonarchbooks/dayloop/ui/skin/MetaphorBaselineTest.kt "$RUNNER_TEMP/MetaphorBaselineTest.kt"
          git checkout 82a86ce287bb62d773555f031e176efb43c3c7ac
          cp "$RUNNER_TEMP/MetaphorBaselineTest.kt" app/src/androidTest/java/com/shadowmonarchbooks/dayloop/ui/skin/MetaphorBaselineTest.kt
          git diff --exit-code 82a86ce287bb62d773555f031e176efb43c3c7ac -- app/src/main app/build.gradle.kts core content
      - name: Record actual build inputs
        run: |
          mkdir -p build/ui-captures
          git rev-parse HEAD > build/ui-captures/production-commit.txt
          git status --short > build/ui-captures/build-worktree.txt
      - name: Build review APKs before starting the emulator
        run: |
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleCandidate --max-workers=2 -Pkotlin.compiler.execution.strategy=in-process
          ./gradlew --stop
      - name: Prepare candidate APK
        if: matrix.review == 'full'
        run: |
          bash tools/android/verify-candidate-signing.sh app/build/outputs/apk/candidate/app-candidate.apk
          mkdir -p build/review-apk
          cp app/build/outputs/apk/candidate/app-candidate.apk build/review-apk/dayloop-v0.16.0-rc13.apk
      - name: Upload candidate APK
        if: matrix.review == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: dayloop-v0.16.0-rc13
          path: build/review-apk/dayloop-v0.16.0-rc13.apk
          retention-days: 14
          if-no-files-found: error
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise daily components and capture Android screenshots
        uses: reactivecircus/android-emulator-runner@v2
        env:
          P3R_UI_TEST_CLASSES: ${{ matrix.classes }}
        with:
          # The review does not use Google services; the AOSP image avoids the
          # background GMS/binder churn that has been taking the API 35 guest
          # down while the app is switching screens.
          api-level: 34
          arch: x86_64
          target: default
          profile: pixel_2
          disable-animations: true
          # Use the emulator's software GLES path for this Compose review.
          # https://developer.android.com/studio/run/emulator-acceleration
          # https://developer.android.com/studio/run/emulator-troubleshooting
          emulator-options: -no-window -gpu software -feature -Vulkan -no-snapshot -noaudio -no-boot-anim -camera-back none -show-kernel
          script: bash tools/android/capture-p3r-ui.sh
      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metaphor-android-review-${{ matrix.review }}-${{ github.sha }}
          path: |
            build/ui-captures/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          retention-days: 14
          if-no-files-found: warn
